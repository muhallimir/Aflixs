<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111111" />
    <title>Offline | Aflixs</title>
    <style>
      body { margin: 0; background: #111; color: #fff; font-family: -apple-system, Arial, sans-serif; display: grid; place-items: center; min-height: 100vh; text-align: center; }
      main { padding: 24px; max-width: 420px; }
      h1 { color: #e50914; }
      a { display: inline-block; margin-top: 16px; background: #e50914; color: #fff; padding: 10px 18px; border-radius: 4px; text-decoration: none; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Aflixs needs a connection to fetch titles. Your My List, downloads info and settings are saved on this device and will be here when you reconnect.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
